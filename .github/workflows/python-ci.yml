name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Exercise installed CLI with example data
        run: |
          asv-explorer --input data/example_taxonomic_abundance.csv --output-dir "${RUNNER_TEMP}/asv-smoke"
          test -s "${RUNNER_TEMP}/asv-smoke/taxonomic_abundance_summary.csv"
          test -s "${RUNNER_TEMP}/asv-smoke/taxonomic_abundance_donut.png"
